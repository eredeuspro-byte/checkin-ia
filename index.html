<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lectura DNI / Pasaporte — Check-in</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: #111318;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    video, canvas, img {
      width: 100%;
      border-radius: 10px;
      background: #1f2430;
      object-fit: cover;
    }
    video { aspect-ratio: 4 / 3; }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    button {
      padding: 12px 14px;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      background: #2b3242;
      color: #fff;
    }
    button.primary { background: #16a34a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .previews {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .slot {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slot span {
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .slot img {
      aspect-ratio: 4 / 3;
    }
    .box {
      background: #1a1f2b;
      border: 1px solid #2d3548;
      border-radius: 10px;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.85rem;
      max-height: 360px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main class="app">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
      <button id="btnCam" type="button">Encender cámara</button>
      <button id="btnFront" type="button" disabled>Foto Anverso</button>
      <button id="btnBack" type="button" disabled>Foto Reverso</button>
      <button id="btnRead" type="button" class="primary" disabled>Leer documento</button>
    </div>

    <div class="previews">
      <div class="slot">
        <span>Anverso</span>
        <img id="imgFront" alt="Vista previa anverso" />
      </div>
      <div class="slot">
        <span>Reverso</span>
        <img id="imgBack" alt="Vista previa reverso" />
      </div>
    </div>

    <div id="status" class="box">Estado: Listo para empezar.</div>
    <div class="box"><pre id="output">{}</pre></div>
  </main>

  <script>
    const WORKER_URL = "https://young-dew-1099.eredeuspro.workers.dev";
    const MODELS = ["gemini-3.8-flash", "gemini-3.8-flash-lite"];

    const PROMPT = `Analiza las imágenes del documento de identidad o pasaporte para check-in hotelero y devuelve ÚNICAMENTE un JSON válido (sin markdown ni texto extra) con esta estructura:
{
  "tipo_documento": "",
  "numero_documento": "",
  "soporte": "",
  "nombre": "",
  "apellidos": "",
  "sexo": "",
  "fecha_nacimiento": "",
  "nacionalidad": "",
  "fecha_expedicion": "",
  "fecha_caducidad": "",
  "domicilio": "",
  "mrz": ""
}
Si algún dato no es visible o no aplica, déjalo como cadena vacía "".`;

    const videoEl = document.getElementById("video");
    const canvasEl = document.getElementById("canvas");
    const btnCam = document.getElementById("btnCam");
    const btnFront = document.getElementById("btnFront");
    const btnBack = document.getElementById("btnBack");
    const btnRead = document.getElementById("btnRead");
    const imgFront = document.getElementById("imgFront");
    const imgBack = document.getElementById("imgBack");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");

    let stream = null;
    let frontBase64 = null;
    let backBase64 = null;

    function setStatus(msg) {
      statusEl.textContent = "Estado: " + msg;
    }

    function updateReadButton() {
      btnRead.disabled = !(frontBase64 || backBase64);
    }

    btnCam.addEventListener("click", async () => {
      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }
        setStatus("Solicitando acceso a la cámara...");
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        videoEl.srcObject = stream;
        btnFront.disabled = false;
        btnBack.disabled = false;
        setStatus("Cámara activa. Enfoca el documento.");
      } catch (err) {
        setStatus("No se pudo abrir la cámara: " + (err.message || err));
      }
    });

    function captureFrame(targetImg, side) {
      if (!videoEl.videoWidth || !videoEl.videoHeight) {
        setStatus("La cámara aún no tiene imagen lista.");
        return;
      }

      const maxWidth = 1280;
      const scale = Math.min(1, maxWidth / videoEl.videoWidth);
      canvasEl.width = Math.round(videoEl.videoWidth * scale);
      canvasEl.height = Math.round(videoEl.videoHeight * scale);

      const ctx = canvasEl.getContext("2d");
      ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

      const dataUrl = canvasEl.toDataURL("image/jpeg", 0.72);
      targetImg.src = dataUrl;

      const base64Clean = dataUrl.split(",")[1];
      if (side === "front") frontBase64 = base64Clean;
      if (side === "back") backBase64 = base64Clean;

      updateReadButton();
      setStatus(`Foto de ${side === "front" ? "anverso" : "reverso"} capturada.`);
    }

    btnFront.addEventListener("click", () => captureFrame(imgFront, "front"));
    btnBack.addEventListener("click", () => captureFrame(imgBack, "back"));

    btnRead.addEventListener("click", async () => {
      if (!frontBase64 && !backBase64) return;

      btnRead.disabled = true;
      outputEl.textContent = "{}";

      const parts = [{ text: PROMPT }];
      if (frontBase64) {
        parts.push({ inlineData: { mimeType: "image/jpeg", data: frontBase64 } });
      }
      if (backBase64) {
        parts.push({ inlineData: { mimeType: "image/jpeg", data: backBase64 } });
      }

      try {
        let data = null;
        let lastError = "";
        let succeeded = false;

        for (const currentModel of MODELS) {
          for (let intento = 1; intento <= 3; intento++) {
            if (intento > 1) {
              const waitMs = intento * 2000;
              setStatus(`${currentModel} saturado. Reintentando (${intento}/3)...`);
              await new Promise(r => setTimeout(r, waitMs));
            } else {
              setStatus(`Enviando imagen(es) a ${currentModel}...`);
            }

            const res = await fetch(WORKER_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                model: currentModel,
                parts
              })
            });

            const rawText = await res.text();

            try {
              data = JSON.parse(rawText);
            } catch {
              lastError = `HTTP ${res.status}: ${rawText.trim()}`;
              if (res.status === 503 || res.status === 524) continue;
              throw new Error(lastError);
            }

            if (!res.ok) {
              lastError = data?.error?.message || data?.error || `HTTP ${res.status}`;
              if (res.status === 503 || res.status === 524) continue;
              setStatus("Error de API: " + lastError);
              outputEl.textContent = JSON.stringify(data, null, 2);
              return;
            }

            lastError = "";
            succeeded = true;
            break;
          }

          if (succeeded) break;
        }

        if (!succeeded) {
          setStatus("Alta demanda en los modelos tras reintentos: " + lastError);
          outputEl.textContent = data ? JSON.stringify(data, null, 2) : lastError;
          return;
        }

        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = text.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/i, "").trim();

        setStatus("Lectura completada.");
        outputEl.textContent = cleanJson || JSON.stringify(data, null, 2);
      } catch (err) {
        setStatus("Error de conexión: " + (err.message || err));
      } finally {
        updateReadButton();
      }
    });
  </script>
</body>
</html>
