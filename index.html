<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba Check-in Hotel con IA</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 16px; background: #f5f5f5; color: #222; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    video, img { width: 100%; max-height: 250px; object-fit: contain; background: #111; border-radius: 8px; margin-top: 8px; }
    button { padding: 10px 16px; margin: 8px 6px 0 0; border: none; border-radius: 8px; background: #1a73e8; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #1558b0; }
    button.secondary { background: #5f6368; }
    button.secondary:hover { background: #484b4e; }
    .grid-fotos { display: flex; gap: 14px; margin-top: 14px; }
    .col-foto { flex: 1; }
    pre { background: #1e1e1e; color: #a6e22e; padding: 16px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Prueba Check-in Hotel con IA (Gemini 3.8 Flash)</h2>

  <div class="card">
    <h3>1. Cámara</h3>
    <video id="video" autoplay playsinline></video>
    <div>
      <button type="button" onclick="encenderCamara()">Encender cámara</button>
      <button type="button" class="secondary" onclick="capturarFoto('anverso')">Foto Anverso (Delante)</button>
      <button type="button" class="secondary" onclick="capturarFoto('reverso')">Foto Reverso (Atrás)</button>
    </div>
    <div class="grid-fotos">
      <div class="col-foto">
        <strong>Anverso:</strong>
        <img id="previewAnverso" alt="Sin foto anverso" />
      </div>
      <div class="col-foto">
        <strong>Reverso:</strong>
        <img id="previewReverso" alt="Sin foto reverso" />
      </div>
    </div>
  </div>

  <div class="card">
    <h3>2. Extraer datos con IA</h3>
    <button type="button" onclick="analizarDocumento()">Leer documento</button>
    <p id="estado">Listo para empezar.</p>
    <pre id="resultado">{}</pre>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6IwKJKeFkH5WUTMgbJCoTZFgjEU3cQhrC-xk72AWXamHQ";
    const MODEL = "gemini-3.8-flash";

    let fotoAnversoBase64 = null;
    let fotoReversoBase64 = null;

    async function encenderCamara() {
      const estado = document.getElementById("estado");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        document.getElementById("video").srcObject = stream;
        estado.textContent = "Cámara encendida.";
      } catch (err) {
        estado.textContent = "Error al abrir la cámara: " + err.message;
      }
    }

    function capturarFoto(lado) {
      const video = document.getElementById("video");
      const estado = document.getElementById("estado");

      if (!video.srcObject || !video.videoWidth) {
        estado.textContent = "Primero pulsa 'Encender cámara' y espera a que se vea imagen.";
        return;
      }

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      const base64 = dataUrl.split(",")[1];

      if (lado === "anverso") {
        fotoAnversoBase64 = base64;
        document.getElementById("previewAnverso").src = dataUrl;
        estado.textContent = "Foto de anverso guardada en memoria.";
      } else {
        fotoReversoBase64 = base64;
        document.getElementById("previewReverso").src = dataUrl;
        estado.textContent = "Foto de reverso guardada en memoria.";
      }
    }

    async function analizarDocumento() {
      const estado = document.getElementById("estado");
      const resultado = document.getElementById("resultado");

      if (!fotoAnversoBase64 && !fotoReversoBase64) {
        estado.textContent = "Haz al menos una foto antes de analizar.";
        return;
      }

      estado.textContent = "Enviando imágenes a Gemini 3.8 Flash...";
      resultado.textContent = "{}";

      const prompt = `Extrae todos los datos de estas imágenes (anverso y reverso) de un documento de identidad para el registro de viajeros en España (Real Decreto 933/2021).
Devuélveme el resultado únicamente en formato JSON válido con estos campos exactos:
- tipo_documento (DNI, PASAPORTE, TIE, OTRO)
- numero_documento
- numero_soporte (el código IDESP o IXESP de 9 caracteres, si existe)
- nombre
- primer_apellido
- segundo_apellido (null si no tiene)
- sexo (M o F)
- fecha_nacimiento (YYYY-MM-DD)
- nacionalidad (código ISO de 3 letras, ej: ESP)
- direccion_completa (del reverso, si aparece)
- localidad (del reverso)
- provincia (del reverso)
- pais_residencia

Si algún dato no aparece en las imágenes, pon null. No inventes nada.`;

      const parts = [{ text: prompt }];

      if (fotoAnversoBase64) {
        parts.push({
          inline_data: {
            mime_type: "image/jpeg",
            data: fotoAnversoBase64
          }
        });
      }

      if (fotoReversoBase64) {
        parts.push({
          inline_data: {
            mime_type: "image/jpeg",
            data: fotoReversoBase64
          }
        });
      }

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(API_KEY)}`;

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "Error en la llamada a la API");
        }

        const textoRespuesta = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const jsonFormateado = JSON.stringify(JSON.parse(textoRespuesta), null, 2);

        resultado.textContent = jsonFormateado;
        estado.textContent = "¡Listo! Datos extraídos.";
      } catch (err) {
        estado.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
